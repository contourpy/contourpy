name: Build binary wheels and sdist

on:
  push:
    tags:
      - v*
  schedule:
    - cron: "12 02 * * SUN"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build_wheels:
    name: ${{ matrix.platform }} ${{ matrix.arch }} wheels
    if: github.repository_owner == 'contourpy'
    runs-on: ${{ matrix.os }}
    env:
      CIBW_PRERELEASE_PYTHONS: True

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-26.04-arm
            arch: aarch64
            platform: linux
          - os: ubuntu-26.04
            arch: ppc64le
            platform: linux
          - os: ubuntu-26.04
            arch: riscv64
            platform: linux
          - os: ubuntu-26.04
            arch: s390x
            platform: linux
          - os: ubuntu-26.04
            arch: x86_64
            platform: linux

          # Pyodide
          - os: ubuntu-26.04
            arch: wasm32
            platform: pyodide

          # macOS
          - os: macos-15
            arch: arm64
            platform: macos
          - os: macos-15-intel
            arch: x86_64
            platform: macos

          # iOS
          # This builds iOS device wheels, but there's not way to test "on
          # device", as there's no CI environment with physical wheels attached.
          # However, the ARM64 simulator and device are sufficiently similar
          # that explicit on-device testing is not generally necessary. This
          # matches the approach taken by PEP 730, and the services offered by
          # Xcode Cloud. See https://peps.python.org/pep-0730/#on-device-testing
          - os: macos-latest
            arch: arm64_iphoneos
            platform: ios
          - os: macos-latest
            arch: arm64_iphonesimulator
            platform: ios
          - os: macos-15-intel
            arch: x86_64_iphonesimulator
            platform: ios

          # Windows
          - os: windows-2022
            arch: AMD64
            platform: windows
          - os: windows-11-arm
            arch: ARM64
            platform: windows
          - os: windows-2022
            arch: x86
            platform: windows

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: all
          # Temporary workaround
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Setup MSVC (32-bit)
        if: ${{ matrix.arch == 'x86' }}
        uses: bus1/cabuild/action/msdevshell@06ea2833eef61e9b0d0ce0d728416e617e4fb1fe # v1
        with:
          architecture: 'x86'

      - name: Fix PATH on win32
        # Avoid this in GHA: "ERROR: Found GNU link.exe instead of MSVC link.exe"
        if: ${{ matrix.arch == 'x86' }}
        run: |
          rm /c/Program\ Files/Git/usr/bin/link.EXE

      - name: Build wheels
        uses: pypa/cibuildwheel@b9e566a2b284570af229f6c2a33673410d0389a3 # v4.3.4
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_PLATFORM: ${{ matrix.platform }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheels_${{ matrix.os }}_${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    if: github.repository_owner == 'contourpy'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install build

      - name: Build sdist
        run: |
          python -m build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contourpy-sdist
          path: dist/*.tar.gz

  merge_wheels:
    name: Merge wheel build artifacts
    runs-on: ubuntu-26.04
    needs: build_wheels
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contourpy-wheels
          pattern: wheels*
          delete-merged: true

  upload_nightlies:
    name: Upload nightly wheels
    if: github.repository_owner == 'contourpy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs: merge_wheels
    steps:
      - name: Download merged wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: contourpy-wheels
          path: dist

      - name: List wheels
        run: ls -l dist

      - name: Upload wheels to scientific python
        uses: scientific-python/upload-nightly-action@16fa02eacee1655195143de09f03676e60ef2bf5 # 0.6.5
        with:
          artifacts_path: dist
          anaconda_nightly_upload_token: ${{ secrets.ANACONDA_ORG_UPLOAD_TOKEN }}
